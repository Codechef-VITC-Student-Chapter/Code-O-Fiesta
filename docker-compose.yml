services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No published port: only the app container can reach the database.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/code-o-fiesta
      MONGODB_MAX_POOL_SIZE: ${MONGODB_MAX_POOL_SIZE:-50}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JUDGE0_API_URL: ${JUDGE0_API_URL:?set JUDGE0_API_URL in .env}
      JUDGE0_AUTH_TOKEN: ${JUDGE0_AUTH_TOKEN:-}

volumes:
  mongo-data:
